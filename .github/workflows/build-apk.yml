name: Build AllPlay Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip AllPlay.zip & Apply Build Fixes
        run: |
          unzip -o AllPlay.zip -d workdir
          PROJECT_DIR=$(dirname "$(find workdir -name 'settings.gradle.kts' | head -n 1)")
          sed -i 's/2\.60\.1/2.58/g' "$PROJECT_DIR/build.gradle.kts" "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/2026\.09\.00/2025.05.00/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/1\.11\.1-0\.16\.0/1.8.0-0.9.0/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/"1\.11\.1"/"1.8.0"/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/"2\.8\.5"/"2.8.4"/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/"3\.6\.3"/"3.1.0"/g' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i "s/couldn't/couldn’t/g" "$PROJECT_DIR/app/src/main/res/values/strings.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload AllPlay Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AllPlay-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
